services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nlrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nlrag
      POSTGRES_USER: nlrag
      POSTGRES_PASSWORD: nlrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: nlrag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_BUILD_ID: ollama-nomic-768
    container_name: nlrag-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nlrag
      SPRING_DATASOURCE_USERNAME: nlrag
      SPRING_DATASOURCE_PASSWORD: nlrag
      SPRING_AI_OLLAMA_BASE_URL: ${SPRING_AI_OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      A2A_PUBLIC_URL: ${A2A_PUBLIC_URL:-http://localhost:8080/a2a}
    ports:
      # Public API / MCP / A2A only. Actuator listens on 8081 inside the
      # container and is scraped by Prometheus on the compose network —
      # it is intentionally not published to the host.
      - "8080:8080"
    expose:
      - "8081"

  prometheus:
    image: prom/prometheus:latest
    container_name: nlrag-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: nlrag-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  pgdata:
  ollama:
