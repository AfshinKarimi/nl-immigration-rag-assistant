server:
  port: 8080

spring:
  application:
    name: nl-immigration-rag-assistant

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nlrag}
    username: ${SPRING_DATASOURCE_USERNAME:nlrag}
    password: ${SPRING_DATASOURCE_PASSWORD:nlrag}

  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # nomic-embed-text (Ollama) produces 768-d vectors
        dimensions: 768
        table-name: document_chunks
    mcp:
      server:
        name: nl-immigration-assistant
        version: 0.1.0
        # SSE endpoint external MCP clients (Claude Desktop, IDEs, other
        # agents) connect to, e.g. http://localhost:8080/sse
        sse-endpoint: /sse
        type: SYNC

  cache:
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=6h

management:
  # Separate HTTP port so /actuator is not on the public API (8080).
  # Prometheus scrapes app:8081 on the Docker network; do not publish 8081
  # to the host in compose (see docker-compose.yml).
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      llmService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
      embeddingService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      llmService:
        max-attempts: 3
        wait-duration: 500ms
      embeddingService:
        max-attempts: 3
        wait-duration: 300ms

# App-specific tunables (referenced from @ConfigurationProperties / @Value)
nlrag:
  retrieval:
    top-k: 50          # candidates pulled from vector search before reranking
    top-n: 5            # final chunks passed to the LLM after reranking
    min-confidence: 0.35 # below this reranker score, the assistant declines to answer
  chunking:
    chunk-size-tokens: 500
    chunk-overlap-tokens: 100
  ingestion:
    max-file-bytes: 5242880  # 5 MiB; keep in sync with spring.servlet.multipart
  a2a:
    public-url: ${A2A_PUBLIC_URL:http://localhost:8080/a2a}
